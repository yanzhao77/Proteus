services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hermes
      POSTGRES_USER: hermes_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
    secrets:
      - postgres_bootstrap_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes_bootstrap -d hermes"]
      interval: 5s
      timeout: 3s
      retries: 20

  migration-bootstrap:
    build:
      context: ../../hermes-runtime
    command: ["python", "-m", "hermes_runtime.migration_bootstrap"]
    environment:
      HERMES_DATABASE_URL_FILE: /run/secrets/hermes_database_url
    secrets:
      - hermes_database_url
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ../../hermes-runtime
    command: ["uvicorn", "hermes_runtime.api_main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      HERMES_DATABASE_URL_FILE: /run/secrets/hermes_database_url
      HERMES_CORS_ORIGINS: ""
    ports:
      - "8080:8080"
    secrets:
      - hermes_database_url
    depends_on:
      migration-bootstrap:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  runtime-supervisor:
    build:
      context: ../../hermes-runtime
    command: ["python", "-m", "hermes_runtime.supervisor_main"]
    environment:
      HERMES_DATABASE_URL_FILE: /run/secrets/hermes_database_url
    secrets:
      - hermes_database_url
    depends_on:
      migration-bootstrap:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  minio:
    # Digest pinned from docker.io/minio/minio:latest verified on 2026-08-17;
    # the previously referenced RELEASE tag does not exist on Docker Hub.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password

  vault:
    image: hashicorp/vault:1.17
    cap_add: ["IPC_LOCK"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID_FILE: /run/secrets/vault_dev_token
    secrets:
      - vault_dev_token

  otel-collector:
    image: otel/opentelemetry-collector:0.104.0

secrets:
  postgres_bootstrap_password:
    file: ./secrets/postgres_bootstrap_password.txt
  hermes_database_url:
    file: ./secrets/hermes_database_url.txt
  minio_root_user:
    file: ./secrets/minio_root_user.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
  vault_dev_token:
    file: ./secrets/vault_dev_token.txt
