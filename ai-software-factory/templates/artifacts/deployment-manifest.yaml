# 部署清单（Deployment Manifest）
version: 0.1.0
services:
  db:
    image: postgres:16
    env: { POSTGRES_DB: app, POSTGRES_USER: app, POSTGRES_PASSWORD: "***" }
    volumes: [db-data:/var/lib/postgresql/data]
  api:
    build: ./backend
    ports: ["8000:8000"]
    depends_on: [db]
  web:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [api]
volumes:
  db-data: {}
# 部署 Provider 抽象（Phase 7+）：BuildProvider / DeployProvider / EnvironmentProvider
