# API 规格（OpenAPI 风格摘要）
openapi: 3.0.0
info:
  title: API
  version: 0.1.0
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: 健康检查
      responses:
        "200": { description: ok }
  /api/v1/auth/register:
    post:
      summary: 用户注册
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201": { description: created, content: { application/json: { schema: { type: object, properties: { token: { type: string } } } } } }
        "409": { description: email exists }
