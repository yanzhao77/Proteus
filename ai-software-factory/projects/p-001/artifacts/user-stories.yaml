stories:
  - id: US-001
    epic: auth
    as: 访客
    want: 注册账号
    so: 可以保存我的待办
    acceptance:
      - 邮箱+密码可注册，弱密码拒绝
      - 注册后自动登录并返回 token
    priority: P0
  - id: US-002
    epic: auth
    as: 用户
    want: 登录已有账号
    so: 继续管理待办
    acceptance:
      - 正确凭据返回 token
      - 错误凭据返回 401
    priority: P0
  - id: US-003
    epic: todos
    as: 用户
    want: 创建、查看、完成、删除我的待办
    so: 管理个人任务
    acceptance:
      - 创建返回 201 与 todo 对象
      - 列表仅返回本人 todo
      - 更新 done 状态生效
      - 删除返回 204
    priority: P0
  - id: US-004
    epic: frontend
    as: 用户
    want: 用网页完成注册登录与待办操作
    so: 不必用 API 客户端
    acceptance:
      - 单页应用可登录并展示/添加/勾选/删除待办
    priority: P1
