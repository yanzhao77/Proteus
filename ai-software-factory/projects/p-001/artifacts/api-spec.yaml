openapi: 3.0.3
info:
  title: p-001 Todo SaaS API
  version: 1.0.0
  description: |
    Todo SaaS 后端 API（与 database-schema.sql 字段一致）。
    认证方式：JWT Bearer Token（POST /api/v1/auth/register|login 返回 access_token）。
    错误语义（4xx 统一响应体 `{ "detail": string }`）：
      - 400 Bad Request：PATCH 空请求体（无任何可更新字段）
      - 422 Unprocessable Entity：业务校验失败（密码强度不足、title 为空/超长、）
      - 401 Unauthorized：未携带/无效/过期 token，或登录凭据错误（响应带 `WWW-Authenticate: Bearer`）
      - 404 Not Found：资源不存在；他人资源也返回 404（防枚举，不返回 403）
      - 409 Conflict：邮箱已被注册
      - 422 的 detail 为数组（FastAPI/Pydantic 默认）；Error.detail 可为 string 或 string[]
servers:
  - url: http://localhost:8000
    description: 本地开发（Phase 2）
tags:
  - name: health
    description: 健康检查
  - name: auth
    description: 注册 / 登录
  - name: todos
    description: 待办 CRUD（需 Bearer 认证）
paths:
  /health:
    get:
      tags: [health]
      summary: 健康检查
      operationId: healthCheck
      responses:
        '200':
          description: 服务健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: 用户注册（成功即自动登录，返回 token）
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功，返回 JWT 与用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: 密码强度不足（少于 8 个字符）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 邮箱已被注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 请求体校验失败（email 格式非法 / 字段缺失）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 用户登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，返回 access_token 与 token_type（附带 user 便于前端）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: 邮箱或密码错误（统一消息，不区分具体原因）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 请求体校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/todos:
    get:
      tags: [todos]
      summary: 获取当前用户的待办列表（仅本人数据）
      operationId: listTodos
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 待办列表（按 created_at 升序）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoListResponse'
        '401':
          description: 未认证 / token 无效或过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [todos]
      summary: 创建待办
      operationId: createTodo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoCreate'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoOut'
        '400':
          description: title 为空或超过 200 字符
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未认证 / token 无效或过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 请求体校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: 待办 ID（当前用户所有）
        schema:
          type: integer
          format: int64
    patch:
      tags: [todos]
      summary: 部分更新待办（更新 done 和/或 title）
      operationId: updateTodo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoUpdate'
      responses:
        '200':
          description: 更新成功，返回更新后的待办
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoOut'
        '400':
          description: 请求体为空（未提供任何可更新字段）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未认证 / token 无效或过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 待办不存在或不属于当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 请求体校验失败（如 title 超长）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [todos]
      summary: 删除待办
      operationId: deleteTodo
      security:
        - BearerAuth: []
      responses:
        '204':
          description: 删除成功，无响应体
        '401':
          description: 未认证 / token 无效或过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 待办不存在或不属于当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [ok, degraded]
          description: 数据库连通性（可选返回）
    Email:
      type: string
      format: email
      maxLength: 255
      description: 用户邮箱；应用层统一转小写后存储/查询
    Password:
      type: string
      minLength: 8
      maxLength: 72
      description: 密码；8–72 字符（bcrypt 输入上限 72 字节）
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
    AuthResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
          description: JWT（HS256，24h 过期）
        token_type:
          type: string
          enum: [bearer]
        user:
          $ref: '#/components/schemas/UserOut'
          description: 当前用户（注册/登录成功时附带）
    UserOut:
      type: object
      required: [id, email, created_at]
      properties:
        id:
          type: integer
          format: int64
          description: 对应 users.id（BIGSERIAL / BigInteger）
        email:
          $ref: '#/components/schemas/Email'
        created_at:
          type: string
          format: date-time
          description: ISO 8601（UTC），对应 users.created_at
    TodoCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: 对应 todos.title VARCHAR(200)
        done:
          type: boolean
          default: false
          description: 对应 todos.done（默认 false）
    TodoUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        done:
          type: boolean
      description: 至少提供一个字段（title 和/或 done）；均不提供返回 400
    TodoOut:
      type: object
      required: [id, title, done, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          description: 对应 todos.id（BIGSERIAL / BigInteger）
        title:
          type: string
          minLength: 1
          maxLength: 200
        done:
          type: boolean
        created_at:
          type: string
          format: date-time
          description: ISO 8601（UTC），对应 todos.created_at
        updated_at:
          type: string
          format: date-time
          description: ISO 8601（UTC），对应 todos.updated_at；由 ORM onupdate 维护
      description: 内部字段 user_id 不对外返回（数据隔离键）
    TodoListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TodoOut'
      description: items 包装便于未来加分页字段
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: 人类可读的错误说明
