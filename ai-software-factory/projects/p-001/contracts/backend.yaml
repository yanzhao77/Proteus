role: backend
mission: 按 api-spec.yaml 与 database-schema.sql 实现 FastAPI 后端
input: [artifacts/api-spec.yaml, artifacts/database-schema.sql, artifacts/architecture.md]
output: [workspace/backend/**]
constraints:
  - 不修改 artifacts/ 下的 spec 类文件
  - SQLAlchemy 模型保持方言无关（Phase 7 换 PostgreSQL）
  - 不引入 requirements.txt 之外的依赖
qualityCriteria: ["pytest 全绿", "无硬编码 secret", "遵循 api-spec 端点"]
failurePolicy: 报告失败原因 + 已完成部分，由 Manager 决定 retry/拆分/换人
