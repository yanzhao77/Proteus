# 角色契约模板 —— 每个角色一份（复制为 contracts/<role>.yaml，委派时注入子代理 prompt）
role: <role>            # backend | frontend | ai | database | qa | security | devops | architect | pm | review
mission: ""
input: []               # 所需 artifacts / tasks 路径
output: []              # 应产出的文件路径 + 变更说明
tools: []               # 允许的工具（默认全部）
constraints:
  - 不修改 spec / architecture 类产物（如需要变更 → 报告 Manager）
  - 不安装未批准的依赖
  - 不在子代理内请求沙箱升级（approval policy = never）
qualityCriteria: []     # 验收标准（必须可独立验证）
failurePolicy: 报告失败原因 + 已完成部分；由 Manager 决定 retry / 拆分 / 换人
