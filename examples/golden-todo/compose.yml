services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - todo-data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://todo:todo@db:5432/todo
      JWT_SECRET: dev-only-compose-secret-change-me
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  todo-data:
