name: Hermes P6

on:
  pull_request:
  workflow_dispatch:

jobs:
  p6-autonomous-trial:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: hermes
          POSTGRES_DB: hermes_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hermes_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r hermes-runtime/requirements.txt
      - name: Create P6 trial database and golden-todo roles/databases
        run: |
          psql -h 127.0.0.1 -p 55432 -U postgres -c "CREATE DATABASE hermes_p6_trial"
          psql -h 127.0.0.1 -p 55432 -U postgres <<'SQL'
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='todo') THEN
                CREATE ROLE todo LOGIN PASSWORD 'todo';
              END IF;
            END \$\$;
            CREATE DATABASE todo OWNER todo;
            CREATE DATABASE todo_test OWNER todo;
SQL
        env:
          PGPASSWORD: hermes
      - name: Run P6 autonomous production trial (real authority, real workers)
        env:
          HERMES_TEST_DATABASE_URL: postgresql://postgres:hermes@127.0.0.1:55432/hermes_test
          HERMES_P6_DATABASE_URL: postgresql://postgres:hermes@127.0.0.1:55432/hermes_p6_trial
          HERMES_P6_TODO_DATABASE_URL: postgresql+psycopg://todo:todo@127.0.0.1:55432/todo_test
          HERMES_P6_EVIDENCE: docs/evidence/p6
          HERMES_P6_WORKSPACES: .p6-workspaces
        run: PYTHONPATH=hermes-runtime/src python -m hermes_runtime.trial.harness
      - name: Upload P6 evidence bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-evidence
          path: docs/evidence/p6
